name: template
description: A template Flutter Project
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  bloc: ^9.1.0
  change_case: ^2.2.0
  collection: ^1.19.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  formz: ^0.8.0
  get_it: ^9.2.0
  go_router: ^17.0.0
  google_fonts: ^6.3.3
  injectable: ^2.7.1+2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  meta: ^1.17.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.10.4
  flutter_gen_runner: ^5.12.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.9.1
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

dependency_overrides:
  collection: ^1.19.1
  intl: ^0.20.1
  meta: ^1.16.0

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    # flare_flutter: true
    # rive: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/google_fonts/
    - assets/icons/
    - assets/images/
